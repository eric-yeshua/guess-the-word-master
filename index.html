<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Guess The Word Game</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- 

  Word Scramblle

  Tries (4/5):

  Mistakes:  a, e, w, t 
  
  Random
  
  Reset
  -->
    <main>
      <section class="container">
        <header>
          <img
            src="/resources/word-scramblle-logo.svg"
            alt="Word Scramblle Logo"
          />
        </header>
        <div class="main">
          <div class="tries-random-container">
            <div class="random-container h1">
              <span id="random-container" class="random-word">random</span>
            </div>
            <div class="tries-container sm">
              <p class="tries" id="tries">Tries (0/5):</p>
              <p class="mistakes" id="mistakes">Mistakes:</p>
            </div>
          </div>
          <div class="boxes" id="boxes"></div>
        </div>
        <footer class="buttons">
          <button id="randomButton" onclick="generateRandomWord()">
            Random
          </button>
          <button id="resetButton">Reset</button>
        </footer>
      </section>
    </main>
    <footer class="main-footer">
      Coded by <a href="#">Joshua Oke</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </footer>

    <script src="main.js"></script>
  </body>
</html>
